name: Lisnai
options:
  bundleIdPrefix: com.lisnai
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: ""  # Add your team ID here later
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: 0.7.9

schemes:
  Lisnai:
    build:
      targets:
        Lisnai: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  Lisnai:
    type: application
    platform: iOS
    deploymentTarget: "26.0"

    sources:
      - path: Lisnai
        excludes:
          - "**/*.md"

    dependencies:
      - package: FluidAudio
      - target: RecordingActivityExtension

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lisnai.Lisnai
        INFOPLIST_FILE: Lisnai/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete

    # Required capabilities for your app
    entitlements:
      path: Lisnai/Lisnai.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.lisnai.shared

    # Info.plist settings
    info:
      path: Lisnai/Info.plist
      properties:
        UILaunchScreen: {}

        # Privacy descriptions (required for App Store)
        NSMicrophoneUsageDescription: "Lisnai records audio throughout your day to create a searchable memory of your life. Your recordings stay private on your device."
        NSLocationWhenInUseUsageDescription: "Lisnai uses your location to remind you to start recording when you leave home."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Lisnai uses your location to automatically remind you to start recording when you leave your home zone."
        NSSpeechRecognitionUsageDescription: "Lisnai transcribes your recordings on-device to make them searchable. Your data never leaves your device."

        # Live Activities support (for Dynamic Island)
        NSSupportsLiveActivities: true

        # Background modes
        UIBackgroundModes:
          - audio
          - fetch
          - location
          - processing
          - remote-notification

        # Minimum iOS version
        LSMinimumSystemVersion: "26.0"

        # Supported interface orientations
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  # Live Activity Widget Extension
  RecordingActivityExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: RecordingActivityExtension
      # Include shared files from main app
      - path: Lisnai/RecordingActivityAttributes.swift
      - path: Lisnai/ResumeRecordingIntent.swift

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lisnai.Lisnai.RecordingActivity
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: complete
        SKIP_INSTALL: YES
        # Required for widget extensions
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

    info:
      path: RecordingActivityExtension/Info.plist
      properties:
        CFBundleDisplayName: RecordingActivity
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
