name: Lisnai
options:
  bundleIdPrefix: com.lisnai
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: "JCG5A6HQ2P"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: 0.7.9

  # Firebase SDK
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 11.6.0

  # Google Sign In
  GoogleSignIn-iOS:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 8.0.0

schemes:
  Lisnai:
    build:
      targets:
        Lisnai: all
    run:
      config: Debug
      environmentVariables:
        CG_NUMERICS_SHOW_BACKTRACE:
          value: "1"
          isEnabled: true
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  Lisnai:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: Lisnai
        excludes:
          - "**/*.md"

    dependencies:
      - package: FluidAudio
      - target: RecordingActivityExtension
      # Firebase
      - package: firebase-ios-sdk
        product: FirebaseAuth
      - package: firebase-ios-sdk
        product: FirebaseFirestore
      - package: firebase-ios-sdk
        product: FirebaseMessaging
      # Google Sign In
      - package: GoogleSignIn-iOS
        product: GoogleSignIn
      - package: GoogleSignIn-iOS
        product: GoogleSignInSwift
      # EventKit (system framework for Reminders/Calendar)
      - sdk: EventKit.framework

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lisnai.Lisnai
        INFOPLIST_FILE: Lisnai/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
        # Required for Firebase
        OTHER_LDFLAGS: $(inherited) -ObjC

    # Required capabilities for your app
    entitlements:
      path: Lisnai/Lisnai.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.lisnai.shared

    # Info.plist settings
    info:
      path: Lisnai/Info.plist
      properties:
        UILaunchScreen: {}

        # Privacy descriptions (required for App Store)
        NSMicrophoneUsageDescription: "Lisnai records audio throughout your day to create a searchable memory of your life. Your recordings stay private on your device."
        NSLocationWhenInUseUsageDescription: "Lisnai uses your location to remind you to start recording when you leave home."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Lisnai uses your location to automatically remind you to start recording when you leave your home zone."
        NSSpeechRecognitionUsageDescription: "Lisnai transcribes your recordings on-device to make them searchable. Your data never leaves your device."

        # Live Activities support (for Dynamic Island)
        NSSupportsLiveActivities: true

        # Background modes
        UIBackgroundModes:
          - audio
          - fetch
          - location
          - processing
          - remote-notification

        # Minimum iOS version
        LSMinimumSystemVersion: "17.0"

        # URL Schemes for Google Sign In and deep links
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - "com.googleusercontent.apps.303903781890-0rfihh50t3a80kf9vemig983pife9trh"
          - CFBundleURLSchemes:
              - "lisnai"

        # Calendar and Reminders usage descriptions
        NSCalendarsUsageDescription: "Lisnai creates calendar events from your conversations to help you stay organized."
        NSCalendarsFullAccessUsageDescription: "Lisnai creates calendar events from your conversations to help you stay organized."
        NSRemindersUsageDescription: "Lisnai creates reminders from your conversations so you don't forget important tasks."
        NSRemindersFullAccessUsageDescription: "Lisnai creates reminders from your conversations so you don't forget important tasks."

        # Supported interface orientations
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  # Live Activity Widget Extension
  RecordingActivityExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: RecordingActivityExtension
      # Include shared files from main app
      - path: Lisnai/RecordingActivityAttributes.swift
      - path: Lisnai/ResumeRecordingIntent.swift
      - path: Lisnai/TaskActivityAttributes.swift

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lisnai.Lisnai.RecordingActivity
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: complete
        SKIP_INSTALL: YES
        # Required for widget extensions
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

    info:
      path: RecordingActivityExtension/Info.plist
      properties:
        CFBundleDisplayName: RecordingActivity
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
